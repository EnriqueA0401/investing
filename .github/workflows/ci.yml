name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=quantlab --cov-report=term-missing
      - name: Trial ledger append-only
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_ledger_append_only.py "origin/${{ github.base_ref }}"
      - name: Smoke run (synthetic, offline)
        run: uv run quantlab run configs/smoke.yaml
