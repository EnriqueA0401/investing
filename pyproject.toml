[project]
name = "quantlab"
version = "0.1.0"
description = "Point-in-time, overfitting-aware research framework for medium/long-horizon multi-asset portfolios."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "yfinance>=0.2.50",
]

[project.scripts]
quantlab = "quantlab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "NPY", "PD", "PT", "DTZ"]
ignore = [
    "PLR0913",  # pipeline components legitimately take many explicit args
    "PLR2004",  # magic numbers are fine in tests / numerical code
    "RUF001", "RUF002", "RUF003",  # Greek letters / math symbols in quant docstrings are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "N802", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["quantlab"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "yfinance.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "leakage: tests that actively try to detect look-ahead / data leakage",
]
filterwarnings = ["error"]
