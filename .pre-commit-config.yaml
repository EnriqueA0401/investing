# Hooks run through `uv run` so tool versions come from uv.lock (single source of truth).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=20000"]
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, src)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: ledger-append-only
        name: trial ledger is append-only
        entry: uv run python scripts/check_ledger_append_only.py
        language: system
        pass_filenames: false
        files: ^research/trials\.jsonl$
